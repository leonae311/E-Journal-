<div class="tjl3-wrap">
<style>
.tjl3-wrap {
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,sans-serif;
  color:#2A2E3A; background:#FAFAF9;
  max-width:1100px; margin:0 auto; padding:28px 16px 60px;
  line-height:1.5;
}
.tjl3-wrap * { box-sizing:border-box; }

/* ── 頁首 ── */
.tjl3-header { margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid #E3E1DC; }
.tjl3-header h1 {
  font-family:"Noto Serif TC","PMingLiU",serif;
  font-size:22px; font-weight:700; margin:0 0 6px; color:#1B1E29;
}
.tjl3-header p { margin:0; font-size:13px; color:#5B6072; }

/* ── 控制列 ── */
.tjl3-controls {
  display:flex; flex-wrap:wrap; gap:10px;
  align-items:center; margin-bottom:14px;
}
.tjl3-controls label { font-size:13px; color:#5B6072; }
.tjl3-filter-wrap { position:relative; }
.tjl3-filter-wrap input,
.tjl3-cat-select {
  padding:7px 12px; border:1px solid #D8D5CE; border-radius:8px;
  font-size:13px; font-family:inherit; background:#fff; color:#2A2E3A;
  outline:none;
}
.tjl3-filter-wrap input { width:220px; }
.tjl3-cat-select { min-width:180px; cursor:pointer; }
.tjl3-filter-wrap input:focus,
.tjl3-cat-select:focus { border-color:#5A4A8C; }

/* ── 統計列 ── */
.tjl3-stat {
  font-size:12.5px; color:#8A8F9C; margin-bottom:10px;
}
.tjl3-stat span { color:#3A3F52; font-weight:600; }

/* ── 表格 ── */
.tjl3-table-wrap { overflow-x:auto; }
table.tjl3-table {
  width:100%; border-collapse:collapse;
  font-size:13px;
}
table.tjl3-table thead th {
  background:#F0EDE8; color:#3A3F52;
  padding:10px 12px; text-align:left;
  white-space:nowrap; font-weight:700;
  border-bottom:2px solid #D8D5CE;
  cursor:pointer; user-select:none;
  position:sticky; top:0; z-index:2;
}
table.tjl3-table thead th:hover { background:#E8E4DC; }
table.tjl3-table thead th .sort-icon {
  display:inline-block; margin-left:4px;
  font-size:10px; color:#B0A898;
}
table.tjl3-table thead th.sorted-asc  .sort-icon { color:#5A4A8C; }
table.tjl3-table thead th.sorted-desc .sort-icon { color:#5A4A8C; }

table.tjl3-table tbody tr {
  border-bottom:1px solid #EDE9E3;
  transition:background .1s;
}
table.tjl3-table tbody tr:hover { background:#F5F3EE; }
table.tjl3-table tbody td { padding:9px 12px; vertical-align:top; }

/* 已停刊列樣式 */
table.tjl3-table tbody tr.disc-row { opacity:.7; background:#FAF7F7; }

/* ── 欄位寬度 ── */
.col-cat   { width:130px; white-space:nowrap; }
.col-name  { min-width:200px; max-width:280px; }
.col-tier  { width:72px; text-align:center; }
.col-hold  { width:110px; }
.col-emb   { width:90px; text-align:center; }
.col-desc  { min-width:200px; color:#5B6072; font-size:12px; }

/* ── 類別標籤 ── */
.cat-dot {
  display:inline-block; width:8px; height:8px;
  border-radius:50%; margin-right:5px; flex-shrink:0;
  vertical-align:middle; position:relative; top:-1px;
}

/* ── 分級標籤 ── */
.tier-badge {
  display:inline-block; font-size:11px; font-weight:700;
  padding:2px 7px; border-radius:4px; white-space:nowrap;
}
.t1 { background:#1B3A6B; color:#fff; }
.t2 { background:#2E5FA3; color:#fff; }
.t3 { background:#6B8CBF; color:#fff; }

/* ── 館藏標籤 ── */
.hold-badge {
  display:inline-block; font-size:11px; font-weight:600;
  padding:2px 7px; border-radius:4px; white-space:nowrap;
}
.h-subscribed { background:#1A6B3C; color:#fff; }
.h-print      { background:#2D6B4A; color:#fff; }
.h-db         { background:#1A5276; color:#fff; }
.h-oa         { background:#117A65; color:#fff; }
.h-check      { background:#7D5A00; color:#fff; }
.h-none       { background:#B0B0B0; color:#fff; }

/* ── 晚X年 ── */
.emb-badge {
  display:inline-block; font-size:11px;
  padding:2px 7px; border-radius:4px; white-space:nowrap;
}
.emb-ok   { background:#D4EDDA; color:#1A6B3C; }
.emb-delay{ background:#FFF3CD; color:#7D5A00; }
.emb-disc { background:#F8D7DA; color:#7B2D2D; }
.emb-na   { color:#B0B0B0; }

/* ── 停刊標記 ── */
.disc-badge {
  display:inline-block; font-size:10px; font-weight:700;
  padding:1px 6px; border-radius:3px;
  background:#7B2D2D; color:#fff; margin-left:5px;
  vertical-align:middle;
}

/* ── 期刊連結 ── */
a.j-link {
  color:inherit; text-decoration:none; font-weight:600;
}
a.j-link:hover { text-decoration:underline; }

/* ── 圖例 ── */
.tjl3-legend {
  display:flex; flex-wrap:wrap; gap:8px 18px;
  font-size:12px; color:#5B6072;
  margin-bottom:14px; padding:12px 16px;
  background:#F5F4F1; border-radius:8px;
  border:1px solid #E3E1DC;
  align-items:center;
}
.tjl3-legend span { display:flex; align-items:center; gap:5px; white-space:nowrap; }

@media(max-width:600px){
  .tjl3-filter-wrap input { width:160px; }
  .col-desc { display:none; }
}
</style>

<script>
const RAW   = [{"cat": "系統神學與倫理", "name": "Modern Theology", "desc": "Modern Theology發表的文章探討神學學科特有的問題以及從神學視角出發的更廣泛議題，包括書評和對文章的回應。本刊秉持普世的編輯方針，並歡迎批判性的書評。", "tier": "T1", "holding": "台神訂閱", "embargo": "0", "disc": false, "url": "https://onlinelibrary.wiley.com/loi/14680025"}, {"cat": "系統神學與倫理", "name": "Scottish Journal of Theology", "desc": "Scottish Journal of Theology是一份國際性的系統神學、歷史神學和聖經神學期刊。自1948年創刊以來，它已成為世界領先的神學期刊之一，致力於促進對基督教傳統各個領域的批判性探討。", "tier": "T2", "holding": "台神訂閱", "embargo": "0", "disc": false, "url": "https://www.cambridge.org/core/journals/scottish-journal-of-theology/all-issues"}, {"cat": "系統神學與倫理", "name": "The Heythrop Journal", "desc": "The Heythrop Journal秉持著神學和哲學學科之間相互交流互惠的理念，為這兩個領域的學者提供發表文章的平臺，並鼓勵跨學科的評論和辯論。涵蓋所有對神學和哲學研究有所貢獻的學科，特別包括詮釋學、經文釋經學、語言學、歷史學、宗教學、宗教哲學、社會學、心理學、倫理學和教牧神學。", "tier": "T2", "holding": "台神訂閱", "embargo": "0", "disc": false, "url": "https://onlinelibrary.wiley.com/loi/14682265/year/2025"}, {"cat": "系統神學與倫理", "name": "The Thomist", "desc": "The Thomist是一份同行評審的學術期刊，面向大學、神學院和教會的廣泛國際讀者。秉承托馬斯·阿奎那的傳統和精神，本刊致力於推動對當代哲學和神學問題的原創性和深刻探究。它特別支持對哲學和系統神學問題的持續討論，並鼓勵創造性地運用阿奎那和托馬斯主義傳統中重要作家的思想來推進此類討論。", "tier": "T2", "holding": "GDTL", "embargo": "0", "disc": false, "url": "https://globaldigital.on.worldcat.org/search/detail/38325812?queryString=The%20Thomist&databaseList=638&clusterResults=false&stickyFacetsChecked=true&baseScope=wz%3A75572&groupVariantRecords=true&scope=wz%3A75572&idDetect=true&bookReviews=off"}, {"cat": "系統神學與倫理", "name": "Gregorianum", "desc": "Gregorianum是宗座格裡高利大學的季刊，創刊於1920年。它參與了上個世紀羅馬天主教會的所有辯論。發表在最高學院（Collegium Maximum）所授學科領域內具有科學價值且尚未發表的論文。該期刊的稿件可以用六種語言撰寫（法語、英語、義大利語、西班牙語、葡萄牙語和德語）。", "tier": "T3", "holding": "ATLAS", "embargo": "1", "disc": false, "url": "https://research.ebsco.com/c/aclxbq/search/advanced/publications/ATLA0000003317?autocorrect=y&limiters=nlebk.DL%3AY&selectedDb=lsdarjnh&searchTerm=Gregorianum&skipResultsFetch=true&sqId=sq%3A66a38621-278e-461c-984a-361e645532da"}, {"cat": "系統神學與倫理", "name": "International Journal rrect=y&limiters=nlebk.DL%3AY&selectedDb=lsdarjnh&searchTerm=Worship"}, {"cat": "教會音樂", "name": "American Organist", "desc": "American Organist（TAO）雜誌由美國管風琴家協會（AGO）每月出版，是全球發行量最大的管風琴和合唱音樂期刊。它是美國管風琴家協會和美國管風琴製造商協會的官方期刊。", "tier": "T3", "holding": "未收錄", "embargo": "", "disc": false, "url": "https://npm.org/pastoral-music/"}, {"cat": "教會音樂", "name": "Choral Journal", "desc": "這份全國性月刊刊載學術性和實用性的文章和專欄，以及對新發行的CD唱片、書籍和樂譜的評論。", "tier": "T3", "holding": "GDTL", "embargo": "1", "disc": false, "url": "https://globaldigital.on.worldcat.org/search/detail/54674537?queryString=Choral%20Journal&databaseList=638&clusterResults=false&stickyFacetsChecked=true&baseScope=wz%3A75572&groupVariantRecords=true&scope=wz%3A75572&idDetect=true&bookReviews=off"}, {"cat": "教會音樂", "name": "Cross Accent", "desc": "Cross Accent是路德會音樂家協會的會刊，每年出版三期。每期涵蓋學術性和資訊性文章，探討路德教會音樂家在神學、音樂學、聖歌學、社會學、禮儀、歷史和實踐等方面遇到的問題，並設有豐富的書籍、唱片和音樂出版物評論專欄。", "tier": "T3", "holding": "ATLAS", "embargo": "0", "disc": false, "url": "https://research.ebsco.com/c/aclxbq/search/advanced/publications/ATLA0001445412?autocorrect=y&limiters=nlebk.DL%3AY&selectedDb=lsdarjnh&searchTerm=Cross+Accent"}, {"cat": "教會音樂", "name": "The Diapason", "desc": "The Diapason 創刊於1909年，是美國歷史最悠久、仍持續發行的管風琴專業期刊，內容涵蓋管風琴、大鍵琴、鐘琴（carillon）與教會音樂，包括樂器規格介紹、國際演奏會與活動訊息、學術與技術性文章，讀者遍及全球風琴師、造琴師、教授與教會音樂工作者，每年出版12期。", "tier": "T3", "holding": "未收錄", "embargo": "", "disc": false, "url": "https://research.ebsco.com/c/aclxbq/search/advanced/publications/ATLA0001445412?autocorrect=y&limiters=nlebk.DL%3AY&selectedDb=lsdarjnh&searchTerm=Cross+Accent"}, {"cat": "教會音樂", "name": "GIA Quarterly", "desc": "由音樂和禮儀領域中一些最受尊敬的人物撰寫的精彩文章，文章語言涵蓋英語和西班牙語。此外，現在您還可以享受更豐富的主日和節日慶典策劃資源，包括更豐富的西班牙語/雙語音樂，以及更多適合現代樂團演奏的音樂，這得益於WLP新推出的《VOICES》讚美詩集。每一期都邀請禮儀和音樂領域的國家級領袖與讀者展開對話，探討如何慶祝能夠改變社區的教區禮拜。", "tier": "T3", "holding": "未收錄", "embargo": "", "disc": false, "url": "https://reformedworship.org/issues"}, {"cat": "教會音樂", "name": "Journal of Church Music", "desc": "Journal of Church Music曾是一份專注於教會禮拜合唱與管風琴曲目的著名紙本刊物。該刊物已於 1990 年代停刊，但其精神透過數個現存致力於聖樂、禮拜儀式及福音音樂的學術與專業期刊得以延續。", "tier": "T3", "holding": "未收錄", "embargo": "", "disc": true, "url": "https://www.tandfonline.com/loi/ultg20"}, {"cat": "教會音樂", "name": "Journal of Worship Resources", "desc": "Journal of Worship Resources是指幾份頂尖的學術與實務出版品，旨在為教會提供禮儀更新、音樂和講道材料。這些期刊提供從經文日課指南、視覺藝術到神學反思等全方位的內容。", "tier": "T3", "holding": "未收錄", "embargo": "", "disc": false, "url": "https://globaldigital.on.worldcat.org/search/detail/1764721?queryString=Sacred%20Music&databaseList=638&clusterResults=false&stickyFacetsChecked=true&baseScope=wz%3A75572&groupVariantRecords=true&scope=wz%3A75572&idDetect=true&bookReviews=off"}, {"cat": "教會音樂", "name": "Liturgy", "desc": "Liturgy是一份季刊，旨在幫助人們學習、預備和舉行基督教禮拜。它為教育工作者、音樂家、牧師、堂區禮儀委員會成員以及教授和神學生提供實用指導和反思。每期《禮儀》都聚焦在不同的主題，由許多懷有信仰的牧師、領袖、學者和作家共同撰寫。", "tier": "T3", "holding": "台神訂閱", "embargo": "0", "disc": false, "url": "https://www.tandfonline.com/loi/ultg20"}, {"cat": "教會音樂", "name": "Organist", "desc": "Organists' Review 是英國管風琴家協會（Incorporated Association of Organists, IAO）發行的官方季刊，自1915年創刊（原名The Quarterly Record），是管風琴世界歷史最悠久的刊物之一，內容涵蓋管風琴演奏、作曲家與演奏家專訪、樂器歷史與建造、樂譜與唱片評論等。【原簡介內容含糊，且資源連結誤植為 Reformed Worship 的網址，已一併修正】", "tier": "T3", "holding": "未收錄", "embargo": "", "disc": false, "url": "https://reformedworship.org/issues"}, {"cat": "教會音樂", "name": "Pastoral Music", "desc": "Pastoral Music是美國牧靈音樂家協會（National Association of Pastoral Musicians，簡稱 NPM）的旗艦雜誌與官方期刊。該雜誌每年出版五期，為羅馬天主教傳統中的神職人員、禮儀專家及教堂音樂家，提供教育性文章、禮儀規劃工具、人物專訪以及曲目評論。", "tier": "T3", "holding": "未收錄／OA", "embargo": "0", "disc": false, "url": "https://npm.org/pastoral-music/"}, {"cat": "教會音樂", "name": "Reformed Worship", "desc": "Reformed Worship是加爾文基督教敬拜學院的一個事工 ，致力於透過分享經過驗證的實踐、深思熟慮的文章、富有想像力的資源和協作學習，將世界各地的敬拜領袖、牧師、音樂家和敬拜團體聯繫起來、裝備他們並激勵他們，所有這些都植根於改革宗/長老會傳統。", "tier": "T3", "holding": "未收錄／OA", "embargo": "0", "disc": false, "url": "https://reformedworship.org/issues"}, {"cat": "教會音樂", "name": "Sacred Music", "desc": "Sacred Music是由美國天主教聖樂協會（Church Music Association of America）於1965年創刊的官方期刊，也是北美地區連續出版歷史最悠久的音樂期刊。", "tier": "T3", "holding": "GDTL", "embargo": "15", "disc": false, "url": "https://globaldigital.on.worldcat.org/search/detail/1764721?queryString=Sacred%20Music&databaseList=638&clusterResults=false&stickyFacetsChecked=true&baseScope=wz%3A75572&groupVariantRecords=true&scope=wz%3A75572&idDetect=true&bookReviews=off"}, {"cat": "教會音樂", "name": "The Organ", "desc": "The Organ 創立於 1921 年的英國經典季刊，專注於管風琴的世界，內容涵蓋全球新舊管風琴介紹、管風琴家與作曲家專訪、樂器歷史與構造探討、音樂節賽事，以及豐富的唱片與文獻評論。【注意：據其官網公告，本刊已於2026年3月31日停刊，目前正尋找買家接手，暫停所有訂閱與後續出版。】", "tier": "T3", "holding": "未收錄", "embargo": "", "disc": true, "url": "https://research.ebsco.com/c/aclxbq/search/advanced/publications/ATLA0000003390?autocorrect=y&limiters=nlebk.DL%3AY&selectedDb=lsdarjnh&searchTerm=Journal+of+Ritual+Studies"}, {"cat": "新約研究", "name": "Journal for the Study of the New Testament", "desc": "Journal for the Study of the New Testament是新約研究領域領先的同儕審查學術期刊之一。該期刊每年出版五期，旨在為學者、新約領域的教師、研究生和高年級本科生等讀者群呈現前沿研究成果。期刊涵蓋並推廣新約研究的各個方面，前提是這些研究必須基於充分發展且經過檢驗的方法論。這包括從歷史視角出發的創新研究、運用社會科學和文學理論的研究，以及發展神學、文化和脈絡分析方法的研究。", "tier": "T1", "holding": "台神訂閱", "embargo": "0", "disc": false, "url": "https://journals.sagepub.com/home/jnt"}, {"cat": "新約研究", "name": "New Testament Studies", "desc": "New Testament Studies由新約研究協會（Studiorum Novi Testamenti Societas）主辦，是一份國際同行評審期刊，其撰稿人包括當今世界頂尖的新約學者。本刊發表英文、法文和德文的原創文章和短篇研究，內容涵蓋新約和早期基督教的起源、歷史、背景和神學等廣泛議題。所有稿件均代表了該學科的前沿研究，並發展出多種研究方法。本刊歡迎近年來採用上述任何研究方法的稿件。本刊涵蓋釋經學、歷史學、文學批判、社會學、神學等多種新約研究方法，包括新約詮釋史及其影響的研究。", "tier": "T1", "holding": "台神訂閱", "embargo": "0", "disc": false, "url": "https://www.cambridge.org/core/journals/new-testament-studies/all-issues"}, {"cat": "新約研究", "name": "Novum Testamentum", "desc": "Novum Testamentum是一份國際領先的期刊，致力於新約及其相關領域的研究。其內容涵蓋文本批判、語文學和釋經學研究，以及旨在將早期基督教文本（包括正典和非正典）和神學置於猶太和希臘羅馬歷史、文化、宗教和文學的更廣闊背景下的探討。", "tier": "T1", "holding": "JSTOR", "embargo": "3", "disc": false, "url": "https://www.jstor.org/journal/novumtestamentum"}, {"cat": "新約研究", "name": "Zeitschrift für die Neutestamentliche Wissenschaft", "desc": "該期刊創刊於1900年，連同其增刊，是國際上新約聖經詮釋領域最負盛名的期刊。期刊每年出版兩期，每期150頁，刊登世界各地傑出學者撰寫的德語、英語和法語原創文章。編輯部秉承高標準，只接受真正推動研究進展的文章，以確保期刊始終保持其公認的高水準。", "tier": "T2", "holding": "台神訂閱", "embargo": "0", "disc": false, "url": "https://www.degruyterbrill.com/journal/key/zntw/html?lang=de&srsltid=AfmBOopcwyx7VcKzJX7QG8qr8P7_hSrl2eGrJctJlCTu-4KoSwo2L-6k"}, {"cat": "新約研究", "name": "Journal for the Study of the Historical Jesus", "desc": "Journal for the Study of the Historical Jesus為學術界提供了一個國際平臺，探討耶穌在其西元一世紀背景下的生平。本刊面向所有對此複雜主題過去研究方法和當今研究方向感興趣的讀者。期刊研究耶穌生活的社會、文化和歷史背景，探討重建歷史耶穌的方法論問題，檢視耶穌研究的歷史，並探討耶穌生平在史學接受史和其他媒體中的呈現方式。", "tier": "T3", "holding": "待確認", "embargo": "1", "disc": false, "url": "https://brill.com/view/journals/jshj/22/3/jshj.22.issue-3.xml"}, {"cat": "新約研究", "name": "Neotestamentica", "desc": "Neotestamentica是南非新約研究協會（NTSSA）的會刊，自1966年創刊以來每年出版，目前每年兩期，共約450頁。該刊致力於展示南非和非洲的學術成果，包括刊登NTSSA年會論文集。", "tier": "T3", "holding": "ATLAS", "embargo": "3", "disc": false, "url": "https://research.ebsco.com/c/aclxbq/search/advanced/publications/ATLA0000003715?autocorrect=y&limiters=nlebk.DL%3AY&selectedDb=lsdarjnh&searchTerm=Neotestamentica"}, {"cat": "新約研究", "name": "Journal of Greco-Roman Christianity and Judaism", "desc": "Journal of Greco-Roman Christianity and Judaism是由麥克馬斯特神學院出版的同行評審 學術期刊。該雜誌發表關於早期基督教和猶太教希臘羅馬世界的文本、語言和文化的研究成果。", "tier": "T3", "holding": "未收錄／OA", "embargo": "0", "disc": false, "url": "https://jgrchj.net/"}, {"cat": "聖經研究綜合與考古", "name": "Journal of Biblical Literature", "desc": "Journal of Biblical Literature（JBL）是一份季刊，致力於促進批判性和學術性的聖經研究。 JBL匯集了最高水準 的專業技術，研究聖經正典、相關文獻和歷史背景， 一個多世紀以來一直是聖經研究領域的旗艦期刊。", "tier": "T1", "holding": "GDTL", "embargo": "0", "disc": false, "url": "https://globaldigital.on.worldcat.org/search/detail/679417485?queryString=Journal%20of%20Biblical%20Literature&databaseList=638&clusterResults=false&stickyFacetsChecked=true&baseScope=wz%3A75572&groupVariantRecords=true&scope=wz%3A75572&idDetect=true&bookReviews=off"}, {"cat": "聖經研究綜合與考古" 0", "disc": false, "url": "https://research.ebsco.com/c/aclxbq/search/advanced/publications/SCP?autocorrect=y&limiters=nlebk.DL%3AY&selectedDb=pdhjnh&searchTerm=Spirituality+in+Clinical+Practice"}];
const CAT_C = {"舊約研究": "#345C40", "新約研究": "#155164", "聖經研究綜合與考古": "#594B2A", "歷史神學": "#6B4727", "系統神學與倫理": "#252E5C", "綜合神學": "#353D52", "實踐神學": "#823F26", "靈性諮商與輔導": "#623142", "靈修": "#3D4F75", "教會音樂": "#4E4170", "其他": "#4A5568"};
const CAT_O = ["舊約研究", "新約研究", "聖經研究綜合與考古", "歷史神學", "系統神學與倫理", "綜合神學", "實踐神學", "靈性諮商與輔導", "靈修", "教會音樂", "其他"];

// ── 排序狀態 ──
let sortCol = 'cat', sortAsc = true;

// ── 填入下拉選單 ──
(function(){
  const sel = document.getElementById('tjl3-cat');
  CAT_O.forEach(c => {
    if(RAW.some(r=>r.cat===c)){
      const o=document.createElement('option'); o.value=c; o.textContent=c; sel.appendChild(o);
    }
  });
})();

// ── 館藏 badge ──
function holdBadge(h){
  if(!h) return '<span class="hold-badge h-none">未收錄</span>';
  const parts = h.split('／');
  let out='';
  const main=parts[0].trim();
  if(['台神訂閱'].includes(main))           out+='<span class="hold-badge h-subscribed">'+main+'</span>';
  else if(main==='台神紙本')               out+='<span class="hold-badge h-print">'+main+'</span>';
  else if(['ATLAS','GDTL','JSTOR','Psy & Beh','APA Psy','台神數位典藏','華藝'].includes(main))
                                            out+='<span class="hold-badge h-db">'+main+'</span>';
  else if(main==='待確認')                 out+='<span class="hold-badge h-check">待確認</span>';
  else                                     out+='<span class="hold-badge h-none">未收錄</span>';
  if(parts.length>1&&parts[1].trim()==='OA') out+=' <span class="hold-badge h-oa">OA</span>';
  return out;
}

// ── 晚X年 badge ──
function embBadge(e){
  if(!e) return '<span class="emb-na">—</span>';
  if(e==='0'||e===0) return '<span class="emb-badge emb-ok">即時更新</span>';
  if(String(e).includes('止')||String(e).startsWith('至'))
    return '<span class="emb-badge emb-disc">館藏至 '+String(e).replace('至','').replace('止','').trim()+'</span>';
  return '<span class="emb-badge emb-delay">晚 '+e+' 年</span>';
}

// ── 分級 badge ──
function tierBadge(t){
  if(t==='T1') return '<span class="tier-badge t1">T1</span>';
  if(t==='T2') return '<span class="tier-badge t2">T2</span>';
  if(t==='T3') return '<span class="tier-badge t3">T3</span>';
  return '';
}

// ── 排序值 ──
function sortVal(row, col){
  if(col==='cat') return CAT_O.indexOf(row.cat)>=0? CAT_O.indexOf(row.cat) : 99;
  if(col==='tier'){
    const m={'T1':0,'T2':1,'T3':2};
    return m[row.tier]??9;
  }
  if(col==='embargo'){
    const e=String(row.embargo);
    if(!e||e==='') return 999;
    if(e==='0') return -1;
    if(e.includes('止')||e.startsWith('至')) return 500;
    const n=parseInt(e); return isNaN(n)?99:n;
  }
  return String(row[col]??'').toLowerCase();
}

// ── 目前篩選後資料 ──
let filtered = [...RAW];

function tjl3Filter(){
  const q   = document.getElementById('tjl3-search').value.toLowerCase();
  const cat = document.getElementById('tjl3-cat').value;
  const tier= document.getElementById('tjl3-tier').value;
  const hold= document.getElementById('tjl3-hold').value;
  filtered = RAW.filter(r=>{
    if(cat  && r.cat!==cat) return false;
    if(tier && r.tier!==tier) return false;
    if(hold==='OA' && !r.holding.includes('OA')) return false;
    else if(hold && hold!=='OA' && !r.holding.startsWith(hold)) return false;
    if(q && !r.name.toLowerCase().includes(q) && !r.desc.toLowerCase().includes(q)) return false;
    return true;
  });
  render();
}

function tjl3Sort(th){
  const col=th.dataset.col;
  if(sortCol===col) sortAsc=!sortAsc; else{ sortCol=col; sortAsc=true; }
  document.querySelectorAll('.tjl3-table thead th').forEach(h=>{
    h.classList.remove('sorted-asc','sorted-desc');
    h.querySelector('.sort-icon').textContent='⇅';
  });
  th.classList.add(sortAsc?'sorted-asc':'sorted-desc');
  th.querySelector('.sort-icon').textContent=sortAsc?'↑':'↓';
  render();
}

function render(){
  const data=[...filtered].sort((a,b)=>{
    const av=sortVal(a,sortCol), bv=sortVal(b,sortCol);
    if(typeof av==='number'&&typeof bv==='number') return sortAsc?av-bv:bv-av;
    return sortAsc?String(av).localeCompare(String(bv),'zh-TW'):String(bv).localeCompare(String(av),'zh-TW');
  });
  const tbody=document.getElementById('tjl3-tbody');
  tbody.innerHTML=data.map(r=>{
    const dot=`<span class="cat-dot" style="background:${CAT_C[r.cat]||'#999'}"></span>`;
    const nameHtml=r.url
      ?`<a class="j-link" href="${r.url}" target="_blank" rel="noopener">${r.name}</a>`
      :`<span style="font-weight:600">${r.name}</span>`;
    const discBadge=r.disc?'<span class="disc-badge">已停刊</span>':'';
    return `<tr class="${r.disc?'disc-row':''}">
      <td class="col-cat">${dot}${r.cat}</td>
      <td class="col-name">${nameHtml}${discBadge}</td>
      <td class="col-tier" style="text-align:center">${tierBadge(r.tier)}</td>
      <td class="col-hold">${holdBadge(r.holding)}</td>
      <td class="col-emb"  style="text-align:center">${embBadge(r.embargo)}</td>
      <td class="col-desc">${r.desc}</td>
    </tr>`;
  }).join('');
  document.getElementById('tjl3-stat').innerHTML=
    `目前顯示 <span>${data.length}</span> 筆，共 <span>${RAW.length}</span> 筆`;
}

// 初始化：預設依分類+分級排序
filtered=[...RAW];
render();
document.querySelector('[data-col="cat"]').classList.add('sorted-asc');
document.querySelector('[data-col="cat"] .sort-icon').textContent='↑';
</script>
